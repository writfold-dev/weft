[workspace]
resolver = "3"
members = ["crates/weft-core", "crates/weft-domain", "crates/weft-frontend", "crates/weft-kernel", "crates/weft-wire", "crates/weft-writfold", "crates/weft-cli"]
exclude = ["tools/weft-quality"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
weft-core = { path = "crates/weft-core" }
weft-domain = { path = "crates/weft-domain" }
weft-frontend = { path = "crates/weft-frontend" }
weft-kernel = { path = "crates/weft-kernel" }
weft-wire = { path = "crates/weft-wire" }
weft-writfold = { path = "crates/weft-writfold" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
